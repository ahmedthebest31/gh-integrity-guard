<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Integrity Guard - Options</title>
    <style>
        :root {
            --color-canvas-default: #ffffff;
            --color-fg-default: #24292f;
            --color-border-default: #d0d7de;
            --color-btn-bg: #2da44e;
            --color-btn-text: #ffffff;
            --color-btn-hover-bg: #2c974b;
            --color-danger-fg: #cf222e;
            --color-danger-border: #d1242f;
            --color-danger-bg: #ffebe9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-canvas-default: #0d1117;
                --color-fg-default: #c9d1d9;
                --color-border-default: #30363d;
                --color-btn-bg: #238636;
                --color-btn-hover-bg: #2ea043;
                --color-danger-fg: #ff7b72;
                --color-danger-border: #f85149;
                --color-danger-bg: rgba(255, 123, 114, 0.1);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--color-canvas-default);
            color: var(--color-fg-default);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--color-border-default);
            border-radius: 6px;
            padding: 24px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--color-fg-default);
            opacity: 0.8;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: var(--color-fg-default);
            background-color: var(--color-canvas-default);
            border: 1px solid var(--color-border-default);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        input:disabled {
            background-color: var(--color-border-default);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            display: inline-block;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 6px;
            appearance: none;
        }

        .btn-primary {
            color: var(--color-btn-text);
            background-color: var(--color-btn-bg);
            border-color: rgba(27, 31, 36, 0.15);
        }

        .btn-primary:hover {
            background-color: var(--color-btn-hover-bg);
        }

        .btn-danger {
            color: var(--color-danger-fg);
            background-color: transparent;
            border-color: var(--color-border-default);
        }

        .btn-danger:hover {
            color: var(--color-canvas-default);
            background-color: var(--color-danger-border);
            border-color: var(--color-danger-border);
        }

        .status {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .status.success {
            color: var(--color-btn-bg);
        }

        .status.error {
            color: var(--color-danger-fg);
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <h1>GitHub API Configuration</h1>
        <p>Enter your Personal Access Token (PAT) to bypass API rate limits. Your token is encrypted and stored locally.</p>
        
        <form id="options-form">
            <label for="pat-input">Personal Access Token</label>
            <input 
                type="password" 
                id="pat-input" 
                placeholder="ghp_xxxxxxxxxxxx" 
                aria-describedby="pat-description"
                aria-required="true"
            >
            <div id="pat-description" class="visually-hidden" style="display: none;">
                Enter a valid GitHub Personal Access Token to increase the extension's rate limit.
            </div>

            <div class="actions">
                <button type="submit" id="save-btn" class="btn btn-primary" aria-label="Save Personal Access Token">Save Token</button>
                <button type="button" id="delete-btn" class="btn btn-danger" aria-label="Delete Personal Access Token" style="display: none;">Delete Token</button>
            </div>
            
            <div id="status-message" class="status" role="alert" aria-live="polite"></div>
        </form>
    </main>
    <script type="module" src="options.js"></script>
</body>
</html>
